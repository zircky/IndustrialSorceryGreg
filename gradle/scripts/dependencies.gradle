dependencies {
  compileOnly(libs.jetbrains.annotations)

  modImplementation(forge.ldlib)
  modImplementation(forge.mui)

  // Registrate
  modImplementation(forge.registrate)

  // Configuration
  modImplementation(forge.configuration)

  // GTCEu
  modImplementation(forge.gtceu)

  // WAILA-likes
  modImplementation(forge.jade)

  // AE2
  jarJar(modImplementation(forge.ae2.get()))
  modImplementation(forge.guideme)
  modImplementation(forge.ae2wtlib)
  modImplementation(forge.expatternprovider)
  modImplementation(forge.megacells)
  modImplementation(forge.clothconfig)
  modImplementation(forge.glodium)

  // Curios
  modImplementation(forge.curios)

  // Mixin (& Extras)
  annotationProcessor(variantOf(libs.mixin) { classifier("processor") })
  annotationProcessor(forge.mixinExtras.common)
  api(forge.mixinExtras.common)

  modImplementation(forge.architectury)

  modCompileOnly(forge.bundles.jei)
  modImplementation(forge.emi)

  // Patchouli
  modRuntimeOnly(forge.patchouli)

  // Botania currently crashes in dev on Forge 47.4.x by reading client config before it is loaded.
  // Re-enable only when the mod actually needs Botania integration.
  // modImplementation(forge.botania)

  // Ad Astra
  modRuntimeOnly(forge.yabn)
  modRuntimeOnly(forge.byteCodecs)
  modImplementation(forge.resourcefullLib)
  modImplementation(forge.resourcefullConfig)
  modImplementation(forge.botarium)
  modImplementation(forge.adAstra)

  // FTB
  modImplementation(forge.ftblibrary.cm)
  modImplementation(forge.ftbteams.cm)

  modImplementation(forge.nuclearcraft)

  modImplementation(forge.flywheel)

}
